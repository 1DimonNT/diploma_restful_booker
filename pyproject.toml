[tool.ruff] 
line-length = 120 
target-version = "py312" 
 
[tool.ruff.lint] 
select = ["E", "W", "F", "I", "C", "B", "UP", "SIM", "TID", "RUF"] 
ignore = ["E501", "B008", "SIM105", "RUF001", "RUF002", "RUF003", "E722", "B904"] 
 
[tool.ruff.lint.per-file-ignores] 
"tests/**/*.py" = ["S101"] 
"conftest.py" = ["S101"] 
 
[tool.ruff.format] 
quote-style = "double" 
indent-style = "space" 
skip-magic-trailing-comma = false 
line-ending = "auto" 
 
[tool.pytest.ini_options] 
minversion = "7.0" 
testpaths = ["api/tests", "ui/tests", "mobile/tests"] 
python_files = "test_*.py" 
python_classes = "Test*" 
python_functions = "test_*" 
addopts = "-v --strict-markers --alluredir=allure-results --clean-alluredir" 
markers = ["api", "ui", "mobile", "smoke", "regression", "critical", "major", "minor"] 
